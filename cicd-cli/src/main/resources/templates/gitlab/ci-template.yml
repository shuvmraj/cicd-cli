stages:
  - install
  - test
  {{#DOCKER_ENABLED}}
  - build-image
  {{/DOCKER_ENABLED}}
  - deploy

variables:
  DOCKER_IMAGE_NAME: "my-app"
  REGISTRY: "docker.io"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - {{{CACHE_PATH}}}

install-dependencies:
  stage: install
  image: {{{DOCKER_IMAGE}}}
  script:
    - {{{BUILD_COMMAND}}}
  artifacts:
    paths:
      - {{{ARTIFACT_PATH}}}
    expire_in: 1 week

run-tests:
  stage: test
  image: {{{DOCKER_IMAGE}}}
  dependencies:
    - install-dependencies
  script:
    - {{{TEST_COMMAND}}}

{{#DOCKER_ENABLED}}
docker-build-push:
  stage: build-image
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD" "$REGISTRY"
  script:
    - docker build -t "$REGISTRY/$DOCKER_USERNAME/$DOCKER_IMAGE_NAME:latest" .
    - docker push "$REGISTRY/$DOCKER_USERNAME/$DOCKER_IMAGE_NAME:latest"
{{/DOCKER_ENABLED}}

deploy-stage:
  stage: deploy
  image: alpine:latest
  before_script:
    - if [ "{{{DEPLOYMENT_TARGET}}}" = "Kubernetes" ]; then apk add --no-cache curl && curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/; fi
  script:
    - {{{DEPLOY_COMMAND}}}
